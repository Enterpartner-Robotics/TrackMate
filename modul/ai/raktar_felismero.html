<!--
    TrackMate Raktár - Léna Képfelismerő
    Beépíthető a raktár modulba VAGY az AI dashboardba
    Elérés: /modul/ai/raktar_felismero.html
-->

<div id="raktar-ai" class="p-4 md:p-6 max-w-[800px] mx-auto">

    <!-- Fejléc -->
    <div class="flex items-center gap-3 mb-6">
        <div class="bg-alapzold text-white rounded-xl w-10 h-10 flex items-center justify-center text-xl">📦</div>
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Raktár Felismerő</h1>
            <p class="text-sm text-gray-500">Léna azonosítja az alkatrészt a fotóról</p>
        </div>
    </div>

    <!-- Kép feltöltés -->
    <div class="bg-white rounded-xl border border-gray-200 p-5 mb-4 shadow-sm">
        <h3 class="font-semibold text-gray-700 mb-3">📸 Fotó készítése vagy feltöltése</h3>
        
        <div class="flex flex-wrap gap-3 mb-4">
            <!-- Kamera (mobil) -->
            <label class="bg-alapzold text-white px-5 py-3 rounded-lg cursor-pointer font-medium hover:bg-green-700 transition">
                📷 Kamera
                <input type="file" accept="image/*" capture="environment" id="raktar-camera" class="hidden" onchange="handleImage(this)">
            </label>
            
            <!-- Galéria/fájl -->
            <label class="bg-blue-600 text-white px-5 py-3 rounded-lg cursor-pointer font-medium hover:bg-blue-700 transition">
                🖼️ Galéria / Fájl
                <input type="file" accept="image/*" id="raktar-file" class="hidden" onchange="handleImage(this)">
            </label>
        </div>

        <!-- Előnézet -->
        <div id="raktar-preview-wrap" class="hidden mb-4">
            <img id="raktar-preview" class="max-h-[300px] rounded-lg border border-gray-300 object-contain">
        </div>

        <button id="raktar-identify-btn" onclick="identifyImage()" class="bg-alapzold text-white px-6 py-3 rounded-lg font-medium disabled:bg-gray-400 w-full md:w-auto" disabled>
            🔍 Léna, mi ez?
        </button>
    </div>

    <!-- AI Eredmény -->
    <div id="raktar-result" class="hidden bg-white rounded-xl border border-gray-200 p-5 mb-4 shadow-sm">
        <h3 class="font-semibold text-gray-700 mb-3">🤖 Léna válasza</h3>
        <div id="raktar-result-content"></div>
    </div>

    <!-- Bevételezés form (AI eredmény után jelenik meg) -->
    <div id="raktar-confirm" class="hidden bg-white rounded-xl border border-green-200 p-5 shadow-sm">
        <h3 class="font-semibold text-green-700 mb-3">✅ Bevételezés</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Termék</label>
                <select id="raktar-aru-id" class="w-full p-2 border rounded-lg">
                    <option value="">Új termék (nincs a listában)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Darabszám</label>
                <input type="number" id="raktar-darab" min="1" value="1" class="w-full p-2 border rounded-lg">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm text-gray-600 mb-1">Megjegyzés</label>
                <input type="text" id="raktar-megj" class="w-full p-2 border rounded-lg" value="AI képfelismerés - Léna">
            </div>
        </div>
        <button onclick="confirmBevetelezes()" class="bg-green-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-green-700 w-full md:w-auto">
            📦 Bevételezés
        </button>
        <div id="raktar-confirm-result" class="mt-3"></div>
    </div>

</div>

<style>
#raktar-ai .rai-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    margin: 2px;
}
.rai-green { background: #d1fae5; color: #065f46; }
.rai-yellow { background: #fef3c7; color: #92400e; }
.rai-red { background: #fee2e2; color: #991b1b; }
.rai-blue { background: #dbeafe; color: #1e40af; }
.rai-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
.rai-row:last-child { border-bottom: none; }
.rai-label { color: #6b7280; font-size: 14px; }
.rai-value { font-weight: 600; color: #1f2937; font-size: 14px; }
</style>

<script>
(function() {
    'use strict';

    const RAKTAR_API = '/ai-module/raktar_api.php';
    let currentImageData = null;
    let currentMimeType = 'image/jpeg';

    // Termékek betöltése a dropdown-ba
    $.post(RAKTAR_API, { action: 'termekek' }, function(data) {
        if (!data || !data.eredmeny) return;
        var opts = '';
        $.each(data.eredmeny, function(i, t) {
            var keszlet = t.keszlet ? ' [' + t.keszlet + ' db]' : ' [0 db]';
            opts += '<option value="' + t.aru_id + '">' + t.aru_megnevezes + keszlet + '</option>';
        });
        $('#raktar-aru-id').append(opts);
    }, 'json');

    // Kép kezelése
    window.handleImage = function(input) {
        var file = input.files[0];
        if (!file) return;

        currentMimeType = file.type || 'image/jpeg';

        var reader = new FileReader();
        reader.onload = function(e) {
            // Előnézet
            $('#raktar-preview').attr('src', e.target.result);
            $('#raktar-preview-wrap').removeClass('hidden');
            $('#raktar-identify-btn').prop('disabled', false);

            // Base64 adat kinyerése (data:image/jpeg;base64, rész nélkül)
            var base64 = e.target.result.split(',')[1];
            currentImageData = base64;

            // Reset
            $('#raktar-result, #raktar-confirm').addClass('hidden');
        };
        reader.readAsDataURL(file);
    };

    // Felismerés
    window.identifyImage = function() {
        if (!currentImageData) { alert('Előbb készíts/válassz fotót!'); return; }

        var $btn = $('#raktar-identify-btn');
        $btn.prop('disabled', true).html('👩‍💻 Léna elemzi a képet...');
        $('#raktar-result').removeClass('hidden');
        $('#raktar-result-content').html('<span class="text-gray-500 italic">🔍 Feldolgozás alatt... (5-15 mp)</span>');
        $('#raktar-confirm').addClass('hidden');

        $.ajax({
            url: RAKTAR_API,
            method: 'POST',
            data: {
                action: 'identify',
                image: 'data:' + currentMimeType + ';base64,' + currentImageData
            },
            dataType: 'json',
            timeout: 120000,
            success: function(data) {
                if (data.status === 'ok') {
                    renderResult(data.eredmeny);
                } else {
                    $('#raktar-result-content').html('<span class="text-red-600">Hiba: ' + data.hiba + '</span>');
                }
            },
            error: function(xhr) {
                $('#raktar-result-content').html('<span class="text-red-600">Hálózati hiba: ' + xhr.statusText + '</span>');
            },
            complete: function() {
                $btn.prop('disabled', false).html('🔍 Léna, mi ez?');
            }
        });
    };

    function renderResult(r) {
        var biztossag = r.egyezes_bizonyossag || 0;
        var biztossagClass = biztossag > 70 ? 'rai-green' : (biztossag > 40 ? 'rai-yellow' : 'rai-red');
        var darabClass = r.darabszam_biztos ? 'rai-green' : 'rai-yellow';

        var html = '<div class="space-y-1">';
        html += '<div class="rai-row"><span class="rai-label">Felismert tárgy</span><span class="rai-value">' + (r.felismert_nev || '?') + '</span></div>';
        html += '<div class="rai-row"><span class="rai-label">Leírás</span><span class="rai-value text-sm font-normal">' + (r.leiras || '-') + '</span></div>';
        html += '<div class="rai-row"><span class="rai-label">Darabszám</span><span class="rai-value">' +
                '<span class="rai-badge ' + darabClass + '">' + r.darabszam + ' db' +
                (r.darabszam_biztos ? ' ✅' : ' ⚠️ becslés') + '</span></span></div>';

        if (r.egyezo_aru_id) {
            html += '<div class="rai-row"><span class="rai-label">Raktári egyezés</span><span class="rai-value">' +
                    '<span class="rai-badge ' + biztossagClass + '">' + (r.egyezo_aru_nev || '#' + r.egyezo_aru_id) +
                    ' (' + biztossag + '%)</span></span></div>';
            if (r.raktar && r.raktar.keszlet !== null) {
                html += '<div class="rai-row"><span class="rai-label">Jelenlegi készlet</span><span class="rai-value">' + r.raktar.keszlet + ' db</span></div>';
            }
        } else {
            html += '<div class="rai-row"><span class="rai-label">Raktári egyezés</span><span class="rai-value"><span class="rai-badge rai-yellow">Nem találtam egyezést</span></span></div>';
        }

        if (r.javasolt_tipus) {
            html += '<div class="rai-row"><span class="rai-label">Javasolt típus</span><span class="rai-value"><span class="rai-badge rai-blue">' + r.javasolt_tipus + '</span></span></div>';
        }

        if (r.megjegyzes) {
            html += '<div class="rai-row"><span class="rai-label">Megjegyzés</span><span class="rai-value text-sm font-normal">' + r.megjegyzes + '</span></div>';
        }

        html += '</div>';
        $('#raktar-result-content').html(html);

        // Bevételezés form előkitöltése
        if (r.egyezo_aru_id) {
            $('#raktar-aru-id').val(r.egyezo_aru_id);
        }
        $('#raktar-darab').val(r.darabszam || 1);
        $('#raktar-megj').val('AI felismerés: ' + (r.felismert_nev || '?') + ' (' + biztossag + '% egyezés)');
        $('#raktar-confirm').removeClass('hidden');
    }

    // Bevételezés
    window.confirmBevetelezes = function() {
        var aruId = $('#raktar-aru-id').val();
        var darab = $('#raktar-darab').val();

        if (!aruId) {
            alert('Válassz terméket a listából!\nHa új termék, előbb vedd fel a raktár modulban.');
            return;
        }
        if (!darab || darab < 1) {
            alert('Adj meg érvényes darabszámot!');
            return;
        }

        var felhId = $('#felh_id').val() || 0;

        $.post(RAKTAR_API, {
            action: 'confirm',
            aru_id: aruId,
            darab: darab,
            megjegyzes: $('#raktar-megj').val(),
            felh_id: felhId
        }, function(data) {
            if (data.status === 'ok') {
                var r = data.eredmeny;
                $('#raktar-confirm-result').html(
                    '<div class="rai-badge rai-green text-base p-3">✅ Bevételezve: ' + r.darab + ' db → Új készlet: ' + r.uj_keszlet + ' db</div>'
                );
            } else {
                $('#raktar-confirm-result').html(
                    '<span class="text-red-600">Hiba: ' + data.hiba + '</span>'
                );
            }
        }, 'json').fail(function(xhr) {
            $('#raktar-confirm-result').html('<span class="text-red-600">Hálózati hiba</span>');
        });
    };

})();
</script>
