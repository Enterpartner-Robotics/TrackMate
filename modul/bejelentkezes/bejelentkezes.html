<script src="/modul/bejelentkezes/server_script/bejelentkezes.js"></script>

<section class="flex min-h-screen justify-center items-center">
  <div id="hibauzenet" class="hidden fixed top-24 bg-red-500 text-white text-center px-6 py-4 rounded shadow-lg transition-opacity duration-500 z-[9999]">
  </div>
  <div class=" bg-white p-6 md:p-8 rounded shadow-lg w-full max-w-md BalrolBe">

    <p class="flex justify-center mb-6">
      <img src="../../assets/logo/trackmate_zold_szeles.png" alt="Trackmate logó" title="Trackmate logó"
        id="regisztracio_logo" class="max-w-full h-auto">
    </p>

    <h2 class="text-center text-xl md:text-2xl font-semibold mb-6 text-fekete ">Bejelentkezés</h2>

    <form id="bejelentkezesForm" method="POST" class="space-y-4">
      <div>
        <label for="username" class="block text-fekete mb-2 text-sm md:text-base ">Felhasználónév/E-mail</label>
        <input type="text" id="username" name="username"
          class="form-input w-full border border-gray-300 rounded p-2 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-zold-500 "
          >
      </div>

      <div>
        <label for="password" class="block text-fekete mb-2 text-sm md:text-base ">Jelszó</label>
        <input type="password" id="password" name="password"
          class="form-input w-full border border-gray-300 rounded p-2 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-zold-500 "
          >
      </div>

      <button type="submit" id="bejelentkezes_gomb"
        class="w-full bg-zold-500 text-white p-2 rounded hover:bg-kek-600 transition-colors text-sm md:text-base">
        Bejelentkezés
      </button>
    </form>

    <p class="text-center mt-4 text-sm md:text-base">Még nincs fiókod?
      <a href="javascript:void(0);" id="regisztracioLink" class="text-alapzold hover:underline">Regisztráció</a>
    </p>
  </div>
</section>
